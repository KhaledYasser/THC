<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Categories — Technology Hall</title>
  <meta name="description" content="Browse Technology Hall's product categories: printers, scanners, POS, ink &amp; toner, accessories, smart home, surveillance and networking."/>
  <meta name="theme-color" content="#0001bb"/>
  <link rel="icon" type="image/png" href="images/brand-hp.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/translations.js"></script>
  <script src="js/tailwind-config.js"></script>
  <script>tailwind.config = window.THC_TAILWIND_CONFIG;</script>
  <link rel="stylesheet" href="css/style.css"/>

<body data-page="categories" class="bg-background text-on-background antialiased">

<header id="site-header"></header>

<main>
  <!-- Page Hero -->
  <section class="relative py-24 px-6 bg-inverse-surface overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img alt="Server room" class="w-full h-full object-cover opacity-20" src="images/server_room_hero.png"/>
      <div class="absolute inset-0 bg-gradient-to-r from-inverse-surface via-inverse-surface/80 to-transparent"></div>
    </div>
    <div class="max-w-7xl mx-auto relative z-10 text-center">
      <h1 class="font-headline-xl text-headline-xl text-on-error mb-4" data-i18n="shop_by_category">Shop by Category</h1>
      <p class="font-body-lg text-body-lg text-secondary-fixed-dim max-w-2xl mx-auto" data-i18n="shop_by_category_desc">Browse our products by category and find exactly what you need.</p>
    </div>
  </section>

  <section class="py-16 max-w-7xl mx-auto px-6">
    <div id="cat-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/app.js" defer></script>
