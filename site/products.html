<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Products — Technology Hall</title>
  <meta name="description" content="Browse the complete Technology Hall product catalog — printers, scanners, POS systems, ink &amp; toner, accessories, networking and more."/>
  <meta name="theme-color" content="#0001bb"/>
  <link rel="icon" type="image/png" href="images/brand-hp.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <script>tailwind.config = window.THC_TAILWIND_CONFIG;</script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="products" class="bg-background text-on-background antialiased">

<header id="site-header"></header>

<main class="max-w-7xl mx-auto px-6 py-12">
  <!-- Header -->
  <div class="mb-10">
    <h1 id="products-title" class="font-headline-lg text-headline-lg text-on-background mb-2">All Products</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">Browse our full range of IT products and enterprise technology solutions.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- Sidebar Filters -->
    <aside class="lg:col-span-3 space-y-8">
      <!-- Search -->
      <div class="bg-surface-container-lowest rounded-lg p-6 border border-outline-variant/30 shadow-sm">
        <form id="search-form" class="flex gap-2" role="search">
          <label for="search-input" class="sr-only">Search products</label>
          <input id="search-input" name="q" type="search" placeholder="Search products…"
            class="flex-1 bg-white border border-outline-variant rounded px-4 py-2.5 text-sm text-on-surface focus:border-primary focus:ring-0 outline-none transition-colors"/>
          <button type="submit" class="bg-primary text-on-primary px-4 py-2.5 rounded hover:bg-surface-tint transition-colors">
            <span class="material-symbols-outlined text-[18px]">search</span>
          </button>
        </form>
      </div>

      <!-- Categories -->
      <div class="bg-surface-container-lowest rounded-lg p-6 border border-outline-variant/30 shadow-sm">
        <h3 class="font-label-md text-label-md text-on-surface-variant mb-4 uppercase tracking-wider">Category</h3>
        <div id="filter-bar" class="flex flex-wrap gap-2" aria-label="Filter by category"></div>
      </div>

      <!-- Brands -->
      <div class="bg-surface-container-lowest rounded-lg p-6 border border-outline-variant/30 shadow-sm">
        <h3 class="font-label-md text-label-md text-on-surface-variant mb-4 uppercase tracking-wider">Brand</h3>
        <div id="brand-bar" class="flex flex-wrap gap-2" aria-label="Filter by brand"></div>
      </div>
    </aside>

    <!-- Product Grid -->
    <section class="lg:col-span-9">
      <!-- Sort + Count -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
        <span id="products-count" class="font-body-md text-body-md text-on-surface-variant"></span>
      </div>

      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js" defer></script>
<script src="js/layout.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
