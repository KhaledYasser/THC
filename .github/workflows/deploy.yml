name: Deploy THC to AWS

on:
  push:
    branches: [main, kimo]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DOMAIN: thc-egypt.org
  BUCKET: thc-egypt.org
  HOSTED_ZONE_ID: Z01691553VW8I2G65I833

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ===== 1. ACM certificate =====
      - name: Verify ACM certificate
        id: acm
        run: |
          CERT_ARN=$(aws acm list-certificates --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='$DOMAIN' && Status=='ISSUED'].CertificateArn | [0]" --output text)
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
            echo "::error::No issued ACM certificate found for $DOMAIN. Please run the initial deploy.sh locally first."
            exit 1
          fi
          echo "cert_arn=$CERT_ARN" >> "$GITHUB_OUTPUT"
          echo "✅ Certificate: $CERT_ARN"

      # ===== 2. S3 bucket =====
      - name: Ensure S3 bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=false,RestrictPublicBuckets=false"
          aws s3 website "s3://$BUCKET/" --index-document index.html --error-document index.html || true

      # ===== 3. Upload site =====
      - name: Upload site to S3
        run: |
          aws s3 sync site/ "s3://$BUCKET/" --delete \
            --cache-control "public, max-age=300" \
            --exclude "*.DS_Store"
          echo "✅ Site uploaded to s3://$BUCKET/"

      # ===== 4. CloudFront =====
      - name: Setup CloudFront and invalidate cache
        id: cloudfront
        run: |
          CERT_ARN="${{ steps.acm.outputs.cert_arn }}"

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items != null && contains(Aliases.Items, '$DOMAIN')].Id | [0]" \
            --output text)

          # OAC
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='thc-oac'].Id | [0]" --output text)
          if [ -z "$OAC_ID" ] || [ "$OAC_ID" = "None" ]; then
            OAC_ID=$(aws cloudfront create-origin-access-control --origin-access-control-config '{
              "Name":"thc-oac","Description":"OAC for THC","SigningProtocol":"sigv4","SigningBehavior":"always","OriginAccessControlOriginType":"s3"
            }' --query "OriginAccessControl.Id" --output text)
          fi
          echo "OAC: $OAC_ID"

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Creating new CloudFront distribution..."
            cat > /tmp/thc-cf.json <<CEOF
          {
            "CallerReference": "thc-$(date +%s)",
            "Aliases": {"Quantity": 1, "Items": ["$DOMAIN"]},
            "DefaultRootObject": "index.html",
            "Origins": {"Quantity": 1, "Items": [{
              "Id": "s3-$BUCKET",
              "DomainName": "$BUCKET.s3.$AWS_REGION.amazonaws.com",
              "OriginAccessControlId": "$OAC_ID",
              "S3OriginConfig": {"OriginAccessIdentity": ""},
              "CustomHeaders": {"Quantity": 0},
              "ConnectionAttempts": 3, "ConnectionTimeout": 10,
              "OriginShield": {"Enabled": false}
            }]},
            "DefaultCacheBehavior": {
              "TargetOriginId": "s3-$BUCKET",
              "ViewerProtocolPolicy": "redirect-to-https",
              "AllowedMethods": {"Quantity": 2, "Items": ["GET","HEAD"], "CachedMethods": {"Quantity": 2, "Items": ["GET","HEAD"]}},
              "Compress": true,
              "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6"
            },
            "CustomErrorResponses": {"Quantity": 2, "Items": [
              {"ErrorCode": 403, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 10},
              {"ErrorCode": 404, "ResponsePagePath": "/index.html", "ResponseCode": "200", "ErrorCachingMinTTL": 10}
            ]},
            "Comment": "$DOMAIN",
            "Enabled": true,
            "ViewerCertificate": {
              "ACMCertificateArn": "$CERT_ARN",
              "SSLSupportMethod": "sni-only",
              "MinimumProtocolVersion": "TLSv1.2_2021"
            },
            "PriceClass": "PriceClass_100",
            "HttpVersion": "http2",
            "IsIPV6Enabled": true
          }
          CEOF
            CREATE_OUT=$(aws cloudfront create-distribution --distribution-config file:///tmp/thc-cf.json)
            DIST_ID=$(echo "$CREATE_OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["Distribution"]["Id"])')
            DIST_DOMAIN=$(echo "$CREATE_OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin)["Distribution"]["DomainName"])')
          else
            DIST_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query "Distribution.DomainName" --output text)
            echo "Using existing distribution $DIST_ID ($DIST_DOMAIN)"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" >/dev/null
          fi
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "dist_domain=$DIST_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "✅ CloudFront: $DIST_ID ($DIST_DOMAIN)"

      # ===== 5. S3 bucket policy =====
      - name: Apply S3 bucket policy for CloudFront OAC
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DIST_ID="${{ steps.cloudfront.outputs.dist_id }}"
          cat > /tmp/thc-bucket-policy.json <<EOF
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Sid":"AllowCloudFrontServicePrincipal",
              "Effect":"Allow",
              "Principal":{"Service":"cloudfront.amazonaws.com"},
              "Action":"s3:GetObject",
              "Resource":"arn:aws:s3:::$BUCKET/*",
              "Condition":{"StringEquals":{"AWS:SourceArn":"arn:aws:cloudfront::$ACCOUNT_ID:distribution/$DIST_ID"}}
            }]
          }
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/thc-bucket-policy.json
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/thc-bucket-policy.json

      # ===== 6. Route53 =====
      - name: Update Route53 DNS record
        run: |
          DIST_DOMAIN="${{ steps.cloudfront.outputs.dist_domain }}"
          cat > /tmp/thc-dns.json <<EOF
          {"Changes":[{"Action":"UPSERT","ResourceRecordSet":{
            "Name":"$DOMAIN.","Type":"A",
            "AliasTarget":{"HostedZoneId":"Z2FDTNDATAQYW2","DNSName":"$DIST_DOMAIN.","EvaluateTargetHealth":false}
          }}]}
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/thc-dns.json
          aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch file:///tmp/thc-dns.json >/dev/null

      - name: Deployment summary
        run: |
          echo "====================================="
          echo "✅ DEPLOYMENT COMPLETE"
          echo "====================================="
          echo "Site:       https://$DOMAIN"
          echo "CloudFront: ${{ steps.cloudfront.outputs.dist_domain }} (${{ steps.cloudfront.outputs.dist_id }})"
